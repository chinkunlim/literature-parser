[project]
name = "literature-parser"
version = "0.1.0"
description = "Enterprise-grade PDF & EPUB Structured Markdown & Image Extractor with Neural Layout OCR, LaTeX Math & Local Ollama AI Verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.142.1",
    "pymupdf>=2.0",
    "pillow>=10.0.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
]  # add with `uv add <package>` (never `pip install`)

[project.scripts]
literature-parser = "literature_parser.entrypoints.cli:main"
doc-processor = "literature_parser.entrypoints.doc_cli:main"
book-processor = "literature_parser.entrypoints.doc_cli:main"
verify-accuracy = "literature_parser.adapters.verification.verifier:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11",
    "playwright>=1.64.1",
]  # add with `uv add --dev <package>`

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Use uv's own downloaded Python (see .python-version), never the system / Homebrew one
python-preference = "only-managed"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Framework-managed files (updated by `agentctl update`) and non-Python folders are not linted here
extend-exclude = ["scripts", ".agents", "gas", "web", "legacy", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/literature_parser/config", "src/literature_parser/domain"]
mypy_path = "src"
strict = false
