[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-processor"
version = "2.2.0"
description = "Enterprise-grade PDF & EPUB Structured Markdown & Image Extractor with Neural Layout OCR, LaTeX Math & Local Ollama AI Verification"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Antigravity", email = "antigravity@google.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
doc-processor = "doc_processor.cli:main"
book-processor = "doc_processor.cli:main"
verify-accuracy = "doc_processor.verification.verifier:main"

[tool.setuptools.packages.find]
where = ["src"]
